services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 10

  app:
    build: .
    environment:
      CONN_STRING: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
      
volumes:
  pgdata:
    name: employees-pgdata
    external: true